<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriverConce - Reserva tu Traslado</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #0f172a;
            --accent: #25D366;
            --accent-hover: #1ebe5d;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            margin: 0;
            color: var(--text);
            padding: 16px 12px;
            min-height: 100vh;
            background:
                linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)),
                url('https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1200&q=80') no-repeat center center fixed;
            background-size: cover;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }
        header {
            background: #0f172a;
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--accent);
        }
        header h1 { margin: 0; font-size: 1.5rem; }
        header p { margin: 5px 0 0; font-size: 0.85rem; color: #cbd5e1; }
        .schedule-badge { display: inline-block; background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; margin-top: 8px; color: #86efac; }

        .vehicle-card {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .vehicle-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .vehicle-photo {
            width: 72px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            border: 1.5px solid #cbd5e1;
            flex-shrink: 0;
            background: #e2e8f0;
        }
        .vehicle-model {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--primary);
        }
        .vehicle-sub {
            font-size: 0.75rem;
            color: var(--muted);
        }
        .plate-badge {
            background: #ffffff;
            border: 2px solid #0f172a;
            border-radius: 6px;
            padding: 4px 9px;
            font-family: monospace;
            font-weight: 800;
            font-size: 0.88rem;
            letter-spacing: 1px;
            color: #0f172a;
            white-space: nowrap;
        }

        .content { padding: 18px; }
        .form-group { margin-bottom: 14px; position: relative; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text); }
        .input-with-btn { display: flex; gap: 8px; align-items: center; }
        input[type="text"], input[type="datetime-local"], select {
            width: 100%;
            padding: 11px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: #ffffff;
        }
        input:focus, select:focus { border-color: #0f172a; }
        .btn-gps {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 12px;
            height: 42px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-gps:disabled { background: #94a3b8; }

        .btn-remove-dest {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 10px;
            width: 40px;
            height: 42px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-add-dest {
            width: 100%;
            background: #eff6ff;
            color: #1d4ed8;
            border: 1.5px dashed #93c5fd;
            border-radius: 10px;
            padding: 9px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 14px;
        }
        .btn-add-dest:hover { background: #dbeafe; }

        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #cbd5e1; border-radius: 0 0 10px 10px; z-index: 1000; max-height: 190px; overflow-y: auto; display: none; }
        .suggestion-item { padding: 10px; font-size: 0.85rem; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
        .suggestion-item:hover { background: #f8fafc; }
        #map { height: 220px; width: 100%; border-radius: 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; z-index: 1; }
        .map-hint { font-size: 0.75rem; color: var(--muted); text-align: center; margin-bottom: 14px; }
        .result-box { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 12px; padding: 14px; margin-bottom: 14px; display: none; }
        .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
        .stat-val { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        .stat-lbl { font-size: 0.75rem; color: var(--muted); }
        .traffic-note { font-size: 0.76rem; color: #b45309; background: #fef3c7; padding: 6px 10px; border-radius: 8px; margin-top: 10px; display: none; text-align: center; }
        .auto-adjust-note { font-size: 0.8rem; color: #0f172a; background: #e0f2fe; border-left: 3px solid #0284c7; padding: 8px 10px; border-radius: 8px; margin-top: 8px; display: none; }
        .recommendation-box { background: #eff6ff; border-left: 4px solid #2563eb; padding: 11px; border-radius: 8px; font-size: 0.85rem; margin-top: 10px; color: #1e3a8a; }
        .payment-box { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 12px; padding: 14px; margin-bottom: 14px; display: none; }
        .payment-title { font-weight: 700; font-size: 0.92rem; color: #92400e; margin-bottom: 6px; }
        .bank-details { background: white; padding: 10px; border-radius: 8px; font-size: 0.82rem; border: 1px solid #fde68a; line-height: 1.5; color: #374151; }
        .btn-copy { background: #f59e0b; color: white; border: none; padding: 9px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; margin-top: 8px; width: 100%; }
        .policy-notice { font-size: 0.78rem; color: #92400e; margin-top: 10px; background: #fef3c7; padding: 8px; border-radius: 6px; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; font-size: 0.82rem; color: #1f2937; }
