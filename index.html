<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriverConce - Reserva tu Traslado</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #0f172a;
            --accent: #25D366;
            --accent-hover: #1ebe5d;
            --card: rgba(255, 255, 255, 0.96);
            --text: #1e293b;
            --muted: #64748b;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            margin: 0; 
            color: var(--text); 
            padding: 20px 15px;
            min-height: 100vh;
            background: 
                linear-gradient(rgba(15, 23, 42, 0.72), rgba(15, 23, 42, 0.82)),
                url('https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1200&q=80') no-repeat center center fixed;
            background-size: cover;
        }

        .container { 
            max-width: 500px; 
            margin: 0 auto; 
            background: var(--card); 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); 
            overflow: hidden; 
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        header { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            color: white; 
            padding: 24px 20px; 
            text-align: center; 
            border-bottom: 3px solid var(--accent);
        }
        header h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.5px; }
        header p { margin: 6px 0 0; font-size: 0.85rem; color: #cbd5e1; }
        .schedule-badge { display: inline-block; background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; margin-top: 8px; color: #86efac; }
        
        .content { padding: 22px; }
        .form-group { margin-bottom: 16px; position: relative; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        
        .input-with-btn { display: flex; gap: 8px; }
        input[type="text"], input[type="datetime-local"], select { 
            width: 100%; 
            padding: 12px; 
            border: 1.5px solid #cbd5e1; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            outline: none; 
            background: #ffffff;
            transition: border 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus { border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1); }
        
        .btn-gps { 
            background: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            padding: 0 14px; 
            font-size: 0.82rem; 
            font-weight: 600; 
            cursor: pointer; 
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }
        .btn-gps:hover { background: #1d4ed8; }
        .btn-gps:disabled { background: #94a3b8; cursor: not-allowed; }

        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #cbd5e1; border-radius: 0 0 10px 10px; z-index: 1000; max-height: 180px; overflow-y: auto; box-shadow: 0 10px 15px rgba(0,0,0,0.1); display: none; }
        .suggestion-item { padding: 10px 12px; font-size: 0.85rem; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
        .suggestion-item:hover { background: #f8fafc; }
        
        #map { height: 200px; width: 100%; border-radius: 12px; margin-bottom: 15px; border: 1.5px solid #cbd5e1; z-index: 1; }
        .map-hint { font-size: 0.76rem; color: var(--muted); text-align: center; margin-top: -10px; margin-bottom: 16px; }
        
        .result-box { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 12px; padding: 15px; margin-bottom: 16px; display: none; }
        .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
        .stat-val { font-size: 1.15rem; font-weight: 700; color: var(--primary); }
        .stat-lbl { font-size: 0.75rem; color: var(--muted); }
        .recommendation-box { background: #eff6ff; border-left: 4px solid #2563eb; padding: 12px; border-radius: 8px; font-size: 0.86rem; margin-top: 12px; color: #1e3a8a; }
        
        .payment-box { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 12px; padding: 15px; margin-bottom: 16px; display: none; }
